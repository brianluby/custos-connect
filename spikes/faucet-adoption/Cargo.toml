[package]
name = "custos-connect-faucet-spike"
version = "0.0.0"
publish = false
edition.workspace = true
# The private evaluation uses Faucet releases requiring 1.96; the SDK does not.
rust-version = "1.96.0"
license.workspace = true

[lints]
workspace = true

[dependencies]
faucet-core = { version = "=1.4.0", default-features = false }
futures = "0.3.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
async-trait = "0.1.89"
faucet-source-rest = { version = "=1.2.2", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
wiremock = "=0.6.5"
