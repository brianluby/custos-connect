# momus: review each pull request and post inline comments.
# Needs a TYPESAFE_API_KEY repository secret. Added by
# https://github.com/brianluby/momus-review/blob/main/scripts/rollout.sh,
# which pins `@v0` below to the latest release's commit SHA; Dependabot
# (.github/dependabot.yml, github-actions) then proposes upgrades as PRs.
name: momus

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Fork pull requests get no secrets: skip them instead of starting a runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: brianluby/momus-review/.github/workflows/review.yml@bb64d2f3b09c32cce75ced029fd1065f0e34ef61 # v0.9.0
    with:
      version: v0.9.0
      verify-attestations: required
      fail-on-blocking: false
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    # with:
    #   exclude: |
    #     vendor/**
    #   fail-on-blocking: false
